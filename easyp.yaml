lint:
  use:
    - DEFAULT
  service_suffix: API
generate:
  inputs:
    - directory: proto
  plugins:
    - name: go
      out: .
      opts:
        module: github.com/graphene-ci/graphene
    - name: go-grpc
      out: .
      opts:
        module: github.com/graphene-ci/graphene
    - name: connect-go
      out: .
      opts:
        module: github.com/graphene-ci/graphene
    # TypeScript for web/ (connect-es v2): protoc-gen-es comes from
    # web/node_modules/.bin — run through `make generate`.
    - name: es
      out: web/src
      opts:
        target: ts
