version: "2"
run:
  go: "1.26"
output:
  formats:
    text:
      path: stdout
  sort-order:
    - linter
    - severity
    - file
linters:
  default: none
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    errcheck:
      check-type-assertions: true
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        # status.Error IS the wrapping for a grpc service: it attaches the
        # code and message the client is meant to see.
        - status.Error(
      ignore-package-globs:
        # This module's own errors already carry this module's vocabulary.
        # wrapcheck exists to stop a foreign error arriving naked; an error
        # from our own port has a name we chose and a package that says
        # where it came from, and wrapping it again produces "blob: blob:
        # not found" — noise that makes the real prefix harder to see.
        #
        # It is deliberately the whole module rather than a list, because
        # the alternative is a list that has to be edited every time a
        # package is added and is silently wrong until somebody notices.
        - github.com/graphene-ci/graphene/internal/*
      ignore-interface-regexps:
        # grpc stream Send errors are transport conditions passed through.
        - ^google\.golang\.org/grpc
        # A guard, a session, a cache: each is a wrapper whose whole job is
        # to pass through what it wraps. An error decorated on the way out
        # of one says only that it went through, which the caller knows.
        - ^github\.com/graphene-ci/graphene/internal
    exhaustive:
      # maps here are partial by design (message templates, format
      # extensions); only switches must be exhaustive.
      check:
        - switch
      default-signifies-exhaustive: true
    cyclop:
      max-complexity: 15
    funlen:
      lines: 75
    gocognit:
      min-complexity: 30
    gocritic:
      disabled-checks:
        - dupImport
        - octalLiteral
        # A domain type here is immutable and is passed by value on
        # purpose. The decisive reason is nil: a pointer can be one, so
        # every method would have to tolerate it and every caller would
        # have to remember — while a value's zero is safe, composes as a
        # map key, and compares with ==. Copying a Resource costs a few
        # words; the pointer costs an allocation and brings nil along.
        #
        # The check is right about the bytes and wrong about the trade,
        # and it is the trade this codebase already decided.
        - hugeParam
        - whyNoLint
        # contradicts nonamedreturns, which we keep
        - unnamedResult
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false
    govet:
      disable:
        - fieldalignment
      enable-all: true
      settings:
        shadow:
          strict: true
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        # Adapters legitimately return the ports they implement, and the
        # ports live beside the domain they belong to rather than under one
        # directory named after the pattern.
        - github.com/graphene-ci/graphene/internal/blob
        - github.com/graphene-ci/graphene/internal/store
        - github.com/graphene-ci/graphene/internal/kernel
        - github.com/graphene-ci/graphene/internal/process
        # grpc's transport credentials are an interface and there is no
        # concrete type to hand back: what this returns is what grpc.Creds
        # takes.
        - google.golang.org/grpc/credentials
    lll:
      line-length: 120
    revive:
      rules:
        # This codebase writes Id, not ID — resource.Id, blob.Id, kind.Id
        # — and a convention held everywhere is worth more than the one Go
        # started with and never applied to its own url.URL. Everything
        # else revive checks stays on.
        - name: var-naming
          disabled: true
    misspell:
      locale: US
      # CANCELLED — pb constant name (wire contract), not renameable.
      ignore-rules:
        - cancelled
    nakedret:
      max-func-lines: 0
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation:
        - funlen
        - gocognit
        - lll
      allow-unused: false
    tagliatelle:
      case:
        rules:
          json: snake
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    varnamelen:
      max-distance: 5
      min-name-length: 3
      check-receiver: false
      check-return: false
      check-type-param: false
      # engine idiom: one-letter names for the pervasive schema/field/value
      # locals mirror the proto vocabulary and stay within max-distance.
      ignore-names:
        - err
        # "Up" is the whole word. A longer name for it would be a worse
        # name, and this is a constant read in one place.
        - Up
        - tc
        - ok
        - f
        - s
        - k
        - v
        - m
        - b
        - l
        - o
        - r
        - d
        - e
        - n
        - x
        - a
        - p
        - id
        - ns
        - ch
        - oo
        - mp
        - vs
        - el
        - it
        - re
        - st
        - en
        - t
        - c
        - g
        - j
        - sv
        - ks
        - pg
        - rf
        - ph
        - gt
        - lt
        - mk
        - vm
        - ts
        - ai
        - bi
        - in
        - dv
        - rt
      ignore-type-assert-ok: false
      ignore-map-index-ok: false
      ignore-chan-recv-ok: false
      ignore-decls:
        - t testing.T
        - f *foo.Bar
        - e error
        - i int
        - const C
        - T any
        - m map[string]int
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        source: ^//\s*go:generate\s
      - linters:
          - godot
        source: (noinspection|TODO)
      - linters:
          - gocritic
        source: //noinspection
      - linters:
          - errorlint
        source: ^\s+if _, ok := err\.\([^.]+\.InternalError\); ok {
      - linters:
          - bodyclose
          - containedctx
          - dupl
          - err113
          - errcheck
          - forcetypeassert
          - funlen
          - goconst
          - gosec
          - noctx
          - wrapcheck
          - gochecknoglobals
          - cyclop
          - gocognit
          - lll
          - maintidx
          # test helpers legitimately return grpc client interfaces
          - ireturn
        path: _test\.go
      - linters:
          - govet
        text: 'shadow: declaration of "(err|ctx)" shadows declaration at'
      # This one test is about a TLS handshake and needs the configuration
      # the package builds, not the transport wrapper around it. An
      # external test package could not see it, and exporting it so a test
      # could would widen the surface for the test's sake.
      - linters:
          - testpackage
        path: internal/link/resume_test\.go
      # A subordinate kernel hands back the far side's answer unaltered —
      # error included. Wrapping there would put this kernel's name on a
      # refusal the kernel above made, and a caller comparing errors would
      # have to know how many proxies it went through.
      - linters:
          - wrapcheck
        path: internal/app/upstream/service\.go
    paths:
      - third_party$
      - builtin$
issues:
  max-same-issues: 50
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/graphene-ci/graphene
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/gopherex)
        - prefix(github.com/graphene-ci/graphenepb)
        - localmodule
      custom-order: true
  exclusions:
    generated: lax
