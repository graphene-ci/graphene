version: "2"
run:
  go: "1.25"
output:
  formats:
    text:
      path: stdout
linters:
  default: standard
  enable:
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - staticcheck
  settings:
    errcheck:
      # Legacy CLI renderers do not all return errors. A failed fmt write means
      # the caller closed the output stream; it does not change server state.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        # Repository convention: identifier suffix is "Id" (matches the
        # protobuf id-message convention), not Go's default "ID".
        - name: var-naming
          arguments:
            - ["ID"]
            - []

  exclusions:
    rules:
      # PullSecret is a Kubernetes Secret reference, never credential bytes.
      - path: internal/managed/k8s_test.go
        linters: [gosec]
        text: "G101"
      # The opt-in uninstall test drives the docker CLI against the
      # container it started itself; the id is docker's own answer.
      - path: internal/ops/uninstall_it_test.go
        linters: [gosec]
        text: "G204"
