version: "2"
run:
  go: "1.25"
output:
  formats:
    text:
      path: stdout
linters:
  default: standard
  enable:
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - staticcheck
  settings:
    errcheck:
      # Legacy CLI renderers do not all return errors. A failed fmt write means
      # the caller closed the output stream; it does not change server state.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        # Repository convention: identifier suffix is "Id" (matches the
        # protobuf id-message convention), not Go's default "ID".
        - name: var-naming
          arguments:
            - ["ID"]
            - []
