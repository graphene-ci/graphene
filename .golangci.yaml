version: "2"
run:
  go: "1.26"
  # Сквозные проверки прячутся за тегом, чтобы make test не требовал
  # кластера. Линтер обязан видеть их всё равно: код, который никто не
  # проверяет, гниёт первым.
  build-tags:
    - e2e
output:
  formats:
    text:
      path: stdout
  sort-order:
    - linter
    - severity
    - file
linters:
  default: none
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    errcheck:
      check-type-assertions: true
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        # status.Error IS the wrapping for a grpc service: it attaches the
        # code and message the client is meant to see.
        - status.Error(
        # IgnoreNotFound hands back the API server's own error unchanged
        # or nothing at all. Wrapping it would put our name on the
        # apiserver's sentence, and a caller comparing errors would have
        # to read past a prefix to find the code it cares about.
        - .IgnoreNotFound(
        # A cancelled context is the caller's own doing, said in the
        # standard library's words. "store: context canceled" tells them
        # something they already know about something they did.
        - ctx.Err(
      ignore-package-globs:
        # This module's own errors already carry this module's vocabulary.
        # wrapcheck exists to stop a foreign error arriving naked; an error
        # from our own port has a name we chose and a package that says
        # where it came from, and wrapping it again produces "blob: blob:
        # not found" — noise that makes the real prefix harder to see.
        #
        # It is deliberately the whole module rather than a list, because
        # the alternative is a list that has to be edited every time a
        # package is added and is silently wrong until somebody notices.
        - github.com/graphene-ci/graphene/*
        # A grpc stream's Send and Recv are things this program passes
        # THROUGH rather than does. What a caller needs is the transport's
        # own words — "the client went away" — and a prefix naming the
        # function that forwarded them buries the sentence that says what
        # happened.
        - google.golang.org/grpc*
      ignore-interface-regexps:
        # grpc stream Send errors are transport conditions passed through.
        - ^google\.golang\.org/grpc
        # A guard, a session, a cache: each is a wrapper whose whole job is
        # to pass through what it wraps. An error decorated on the way out
        # of one says only that it went through, which the caller knows.
        - ^github\.com/graphene-ci/graphene/
    exhaustive:
      # maps here are partial by design (message templates, format
      # extensions); only switches must be exhaustive.
      check:
        - switch
      default-signifies-exhaustive: true
    cyclop:
      max-complexity: 15
    funlen:
      lines: 75
    gocognit:
      min-complexity: 30
    gocritic:
      disabled-checks:
        - dupImport
        - octalLiteral
        # A domain type here is immutable and is passed by value on
        # purpose. The decisive reason is nil: a pointer can be one, so
        # every method would have to tolerate it and every caller would
        # have to remember — while a value's zero is safe, composes as a
        # map key, and compares with ==. Copying a Resource costs a few
        # words; the pointer costs an allocation and brings nil along.
        #
        # The check is right about the bytes and wrong about the trade,
        # and it is the trade this codebase already decided.
        - hugeParam
        - whyNoLint
        # contradicts nonamedreturns, which we keep
        - unnamedResult
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false
    govet:
      disable:
        - fieldalignment
      enable-all: true
      settings:
        shadow:
          strict: true
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        # A kubernetes object is an interface by design: runtime.Object and
        # client.Object have no concrete type to hand back, and a function
        # returning one returns exactly what the machinery takes.
        - k8s.io/apimachinery/pkg/runtime
        - sigs.k8s.io/controller-runtime/pkg/client
        # The dynamic client and its per-resource handle are interfaces by
        # design: working with kinds that did not exist at compile time is
        # what they are for, so there is no concrete type to name.
        - k8s.io/client-go/dynamic
        # Temporal's client and its futures are interfaces the SDK defines;
        # there is nothing concrete underneath to name.
        - go.temporal.io/sdk/client
        - go.temporal.io/sdk/workflow
        # Открытый ключ ssh — это интерфейс в x/crypto/ssh: у RSA, ed25519
        # и ecdsa нет общего конкретного типа, и вернуть можно только его.
        - golang.org/x/crypto/ssh
    mnd:
      # A command's arity is a number and naming it does not make it one
      # of anything: cobra.ExactArgs(2) already reads as "two arguments".
      ignored-functions:
        - cobra.ExactArgs
        - cobra.MaximumNArgs
        - cobra.MinimumNArgs
        - cobra.RangeArgs
    gomoddirectives:
      # Единственный разрешённый replace: соседний модуль этого же
      # репозитория в этом же коммите. Правило про replace написано
      # против зависимостей, приходящих не с GitHub; SDK лежит рядом,
      # и go mod tidy иначе полез бы в сеть за тегом, которого нет.
      replace-local: true

    lll:
      line-length: 120
    misspell:
      locale: US
    nakedret:
      max-func-lines: 0
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation:
        - funlen
        - gocognit
        - lll
      allow-unused: false
    tagliatelle:
      case:
        # Our JSON is kubernetes API JSON, and kubernetes spells fields in
        # lowerCamelCase everywhere — spec.forProvider, status.atProvider,
        # metadata.creationTimestamp. A different case here would mean our
        # kinds read differently from every other kind in the cluster.
        rules:
          json: camel
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    varnamelen:
      max-distance: 5
      min-name-length: 3
      check-receiver: false
      check-return: false
      check-type-param: false
      # Short locals whose whole life fits inside a few lines: a loop
      # variable, one watcher inside its own loop, the transaction every
      # database library in the world already calls tx. max-distance keeps
      # them honest — a short name that travels far is still reported.
      ignore-names:
        - err
        - tx
        - w
        - do
        - ok
        - id
        - ns
        - ch
        - fn
        - i
        - j
        - k
        - n
        - t
        - v
      ignore-type-assert-ok: false
      ignore-map-index-ok: false
      ignore-chan-recv-ok: false
      ignore-decls:
        - t testing.T
        - f *foo.Bar
        - e error
        - i int
        - const C
        - T any
        - m map[string]int
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        source: ^//\s*go:generate\s
      - linters:
          - godot
        source: (noinspection|TODO)
      - linters:
          - gocritic
        source: //noinspection
      - linters:
          - bodyclose
          - containedctx
          - dupl
          - err113
          - errcheck
          - forcetypeassert
          - funlen
          - goconst
          - gosec
          - noctx
          - wrapcheck
          - gochecknoglobals
          - cyclop
          - gocognit
          - lll
          - maintidx
          # Test helpers legitimately hand back the interfaces the code
          # under test consumes.
          - ireturn
          # Subtest BODIES passed to a runner are not helpers. t.Helper()
          # in one would report every failure at the line inside the
          # runner rather than at the assertion that failed, which is the
          # opposite of what it is for. Real helpers here do call it.
          - thelper
          # Style linters that are about production code being read for
          # years. A test fixture is read while it is being written and
          # then only when it fails, and the numbers in one — three keys,
          # two events, seven writes — are the test, not magic.
          - gocritic
          - mnd
          - prealloc
          - unparam
          - contextcheck
        path: _test\.go
      # Пример обязан читаться как код, который человек и правда
      # напишет. err113 — правило для библиотек, чьи ошибки сравнивают;
      # ошибку пайплайна читает человек в выводе прогона, и требовать
      # там объявленных сентинелов значит показывать пользователю не то,
      # что он будет писать.
      - linters:
          - err113
        path: ^examples/
      # Сквозные проверки делят один кластер и один пайплайн. Параллельные
      # прогоны в нём возможны и будут проверяться отдельно (M5, аренда);
      # здесь же они превратили бы «оператор убит посреди прогона» в
      # «оператор убит посреди чьего-то ещё прогона».
      - linters:
          - paralleltest
        path: ^test/e2e/
      - linters:
          - govet
        text: 'shadow: declaration of "(err|ctx)" shadows declaration at'
      # kubernetes spells a trailing acronym in upper case and always has:
      # podIP, clusterIP, providerID, machineID, bootID, podCIDR. Our kinds
      # sit next to those in the same cluster and are read by the same
      # people; workflowId would be the odd one out, not the correct one.
      - linters:
          - tagliatelle
        path: ^api/
      # A command's error is printed to the person who ran it, already
      # prefixed with the name of the binary. A second prefix naming the
      # function that returned it is noise in the one place where the
      # words matter most.
      - linters:
          - wrapcheck
        path: ^cmd/
    paths:
      - third_party$
      - builtin$
issues:
  max-same-issues: 50
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/graphene-ci/graphene
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true
  exclusions:
    generated: lax
