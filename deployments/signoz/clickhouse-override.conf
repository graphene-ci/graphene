# Volumes mount root-owned and systemd-tmpfiles does not run in this
# containerized boot — hand the dirs to the clickhouse user (created by
# our sysusers drop-in) right before each start.
[Service]
ExecStartPre=+/bin/sh -c 'mkdir -p /var/log/clickhouse-server && chown -R clickhouse:clickhouse /var/lib/clickhouse /var/log/clickhouse-server 2>/dev/null; chown -R clickhouse:clickhouse /var/lib/clickhouse-keeper 2>/dev/null || true'
