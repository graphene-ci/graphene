# The otel collector behind the door: the server forwards every
# worker's/agent's OTLP export here (namespace already stamped). The
# BACKEND is pluggable — swap the exporters (VictoriaMetrics/Logs,
# Tempo, Loki, ...) without touching graphene.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  # Placeholder backend: prints to the collector's stdout. Replace with
  # your real stack.
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
