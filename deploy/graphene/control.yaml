# Управляющий слой: оператор сшивает записи с Temporal, системный воркер
# выполняет то, что заказывают пайплайны.
#
# Образы подставляются при установке (`make install`): она собирает их
# из этого же репозитория и заносит в локальный кластер.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphene-operator
  namespace: graphene-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: graphene
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphene
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: graphene
      containers:
        - name: operator
          image: OPERATOR_IMAGE
          env:
            - name: GRAPHENE_TEMPORAL_ADDRESS
              value: temporal.temporal.svc:7233
            - name: GRAPHENE_TEMPORAL_NAMESPACE
              value: graphene
            - name: GRAPHENE_METRICS_ADDRESS
              value: "0"
          ports:
            - name: dist
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphene-worker
  namespace: graphene-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: graphene
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphene
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: graphene
      containers:
        - name: worker
          image: WORKER_IMAGE
          env:
            - name: GRAPHENE_TEMPORAL_ADDRESS
              value: temporal.temporal.svc:7233
            - name: GRAPHENE_TEMPORAL_NAMESPACE
              value: graphene
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
---
# Раздача бинаря агента наружу. Машина приходит сюда за агентом сама:
# у нас нет входящего доступа к ней и не предполагается.
apiVersion: v1
kind: Service
metadata:
  name: graphene-dist
  namespace: graphene-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: graphene
    app.kubernetes.io/component: operator
  ports:
    - name: dist
      port: 8080
      targetPort: dist
      nodePort: 30080
