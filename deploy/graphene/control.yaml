# Управляющий слой: оператор сшивает записи с Temporal, системный воркер
# выполняет то, что заказывают пайплайны.
#
# Значения в __ДВОЙНЫХ_ПОДЧЁРКИВАНИЯХ__ подставляет `make install`.
# Подчёркивания не для красоты: голое AGENT_TEMPORAL — подстрока имени
# GRAPHENE_AGENT_TEMPORAL, и sed однажды переименовал саму переменную.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphene-operator
  namespace: graphene-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: graphene
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphene
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: graphene
      containers:
        - name: operator
          image: __OPERATOR_IMAGE__
          env:
            - name: GRAPHENE_TEMPORAL_ADDRESS
              value: temporal.temporal.svc:7233
            - name: GRAPHENE_TEMPORAL_NAMESPACE
              value: graphene
            # Приёмник трасс. Пусто — трассировка выключена, и это рабочая
            # настройка: ничего не пишется и ничего за это не платится.
            # ЧЕМ это будет на самом деле — решается не здесь: поставка
            # целиком (зонтичный helm и окружение) — отдельная стадия.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: __OTLP__
            - name: GRAPHENE_METRICS_ADDRESS
              value: "0"
            # Адреса, по которым до нас достучится МАШИНА. Внутрикластерное
            # имя ей не годится: она снаружи. Пока идёт разработка это
            # туннель, а без него — петля, чего хватает контейнеру-машине.
            - name: GRAPHENE_CONTROL
              value: __CONTROL_URL__
            - name: GRAPHENE_AGENT_TEMPORAL
              value: __AGENT_TEMPORAL__
            # Куда едут артефакты. Endpoint — как до хранилища достаём мы,
            # PUBLIC — как до него достаёт МАШИНА: имя службы кластера ей
            # не значит ничего, и это не исключение, а обычный случай.
            - name: GRAPHENE_STORAGE_ENDPOINT
              value: storage.storage.svc:9000
            - name: GRAPHENE_STORAGE_PUBLIC
              value: __STORAGE_PUBLIC__
            - name: GRAPHENE_STORAGE_BUCKET
              value: graphene
            # Верх цепочки наследования сроков: что хранит УСТАНОВКА,
            # когда ни пайплайн, ни артефакт не сказали. Конечен, потому
            # что хранилище, которое только растёт, однажды встаёт.
            - name: GRAPHENE_ARTIFACT_RETENTION
              value: 168h
            - name: GRAPHENE_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: storage, key: accessKey}
            - name: GRAPHENE_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: storage, key: secretKey}
          ports:
            - name: dist
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphene-worker
  namespace: graphene-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: graphene
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphene
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: graphene
      containers:
        - name: worker
          image: __WORKER_IMAGE__
          env:
            - name: GRAPHENE_TEMPORAL_ADDRESS
              value: temporal.temporal.svc:7233
            - name: GRAPHENE_TEMPORAL_NAMESPACE
              value: graphene
            # Приёмник трасс. Пусто — трассировка выключена, и это рабочая
            # настройка: ничего не пишется и ничего за это не платится.
            # ЧЕМ это будет на самом деле — решается не здесь: поставка
            # целиком (зонтичный helm и окружение) — отдельная стадия.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: __OTLP__
            # Куда едут артефакты. Endpoint — как до хранилища достаём мы,
            # PUBLIC — как до него достаёт МАШИНА: имя службы кластера ей
            # не значит ничего, и это не исключение, а обычный случай.
            - name: GRAPHENE_STORAGE_ENDPOINT
              value: storage.storage.svc:9000
            - name: GRAPHENE_STORAGE_PUBLIC
              value: __STORAGE_PUBLIC__
            - name: GRAPHENE_STORAGE_BUCKET
              value: graphene
            # Верх цепочки наследования сроков: что хранит УСТАНОВКА,
            # когда ни пайплайн, ни артефакт не сказали. Конечен, потому
            # что хранилище, которое только растёт, однажды встаёт.
            - name: GRAPHENE_ARTIFACT_RETENTION
              value: 168h
            - name: GRAPHENE_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: storage, key: accessKey}
            - name: GRAPHENE_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: storage, key: secretKey}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
---
# Раздача бинаря агента наружу. Машина приходит сюда за агентом сама:
# у нас нет входящего доступа к ней и не предполагается.
apiVersion: v1
kind: Service
metadata:
  name: graphene-dist
  namespace: graphene-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: graphene
    app.kubernetes.io/component: operator
  ports:
    - name: dist
      port: 8080
      targetPort: dist
      nodePort: 30080
