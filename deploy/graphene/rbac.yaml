apiVersion: v1
kind: Namespace
metadata:
  name: graphene-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: graphene
  namespace: graphene-system
---
# Права v0, и они широкие. Системный воркер применяет то, что заказал
# пайплайн, а заказать он может любой вид любого установленного провайдера
# — виды, которых не существовало, когда этот бинарь собирали. Сузить это
# списком нельзя; сузить можно только политикой того, кому вообще позволено
# заводить пайплайны.
#
# ОБЯЗАТЕЛЬСТВО M7: разграничение прав — «вижу и трогаю только свои
# прогоны» — вместе с моделью прав Temporal. Записано здесь, а не
# отложено молча.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: graphene
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: graphene
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: graphene
subjects:
  - kind: ServiceAccount
    name: graphene
    namespace: graphene-system

# Воркеры пайплайнов поднимаются оператором в том пространстве имён, где
# лежит ревизия. Служебной учётки им не заводим: кластер им не нужен
# вообще, они только ходят в Temporal.
