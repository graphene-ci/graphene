---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: stands.graphene-ci.dev
spec:
  group: graphene-ci.dev
  names:
    kind: Stand
    listKind: StandList
    plural: stands
    singular: stand
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.until
      name: Until
      type: string
    - jsonPath: .spec.runRef.name
      name: Run
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Stand is what a run left behind on purpose.

          Everything it owns dies with it, through the cluster's own collector —
          the same mechanism that ties records to a run, pointed at a different
          owner.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              StandSpec is what a run left standing.

              A stand exists because "keep this for a day" cannot mean "delay the
              teardown": a delay still ends in a teardown, and the person who comes in
              the morning to look at the machine that failed the test finds nothing.
              It has to mean the machines outlive the run — which means somebody else
              answers for them.

              That somebody is this record, and it has an end. The rule from FORM
              holds: an owner must have a reason to die. Without one, "keep for a day"
              becomes "keep forever", and forever is what an empty cloud account turns
              into a full one.
            properties:
              reason:
                description: Reason is why it was kept, in the words of whoever kept
                  it.
                type: string
              runRef:
                description: |-
                  RunRef says which run left it. For a person reading `kubectl get`
                  and wondering what this is and why it is here.
                properties:
                  name:
                    description: Name of the record referred to.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              until:
                description: Until is when the stand stops standing. There is no "never".
                format: date-time
                type: string
            required:
            - runRef
            - until
            type: object
          status:
            description: StandStatus is what the system knows about the stand.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
