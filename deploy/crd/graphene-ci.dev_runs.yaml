---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: runs.graphene-ci.dev
spec:
  group: graphene-ci.dev
  names:
    kind: Run
    listKind: RunList
    plural: runs
    singular: run
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.revisionRef.name
      name: Revision
      type: string
    - jsonPath: .status.startedAt
      name: Started
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Run is one execution of a revision. It is not deleted when it finishes:
          it changes phase and stays as the history of what happened.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'RunSpec is the ask: this revision, with these parameters.'
            properties:
              cancel:
                description: |-
                  Cancel asks the run to stop.

                  It lives in the spec rather than being a command because stopping a
                  run is a decision about the world, and decisions about the world are
                  records: a person, a UI and kubectl all say it the same way, and the
                  wish survives whoever expressed it going away.

                  Asking to cancel is not the same as killing. A cancelled pipeline is
                  told to stop and gets to run its own teardown — that is what
                  run.Teardown on a disconnected context exists for. Killing is what
                  happens when the RECORD is deleted, and then we clean up ourselves.
                type: boolean
              params:
                description: Params for this run, shaped by the revision's parameter
                  schema.
                x-kubernetes-preserve-unknown-fields: true
              revisionRef:
                description: |-
                  RevisionRef names the revision to execute — a revision and not a
                  pipeline, because a run is nailed to concrete code. Otherwise
                  "repeat this run" would mean "execute whatever is there now".
                properties:
                  name:
                    description: Name of the record referred to.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - revisionRef
            type: object
          status:
            description: RunStatus is what became of the ask.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              finishedAt:
                format: date-time
                type: string
              phase:
                description: |-
                  RunPhase is where a run got to. It never goes backwards, and a run in a
                  terminal phase stays: the record is the history, not a live process.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Canceled
                type: string
              reason:
                description: Reason says why the run stopped, in the words of whoever
                  knows.
                type: string
              result:
                description: |-
                  Result is what the pipeline returned. Small by design — a report
                  goes to artifact storage, not into a record every controller in the
                  cluster watches.
                x-kubernetes-preserve-unknown-fields: true
              startedAt:
                format: date-time
                type: string
              temporalRunID:
                description: |-
                  TemporalRunID identifies which attempt of that workflow is going
                  now. It changes on retry; WorkflowID does not.
                type: string
              workflowID:
                description: |-
                  WorkflowID is the run's workflow in Temporal. It always equals the
                  record's own name: that is what makes starting the workflow safe to
                  retry — the second attempt collides with the first instead of
                  starting a second run.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
