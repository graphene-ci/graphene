---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: artifacts.graphene-ci.dev
spec:
  group: graphene-ci.dev
  names:
    kind: Artifact
    listKind: ArtifactList
    plural: artifacts
    singular: artifact
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.runRef.name
      name: Run
      type: string
    - jsonPath: .status.size
      name: Size
      type: integer
    - jsonPath: .spec.until
      name: Until
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Artifact is a report, a log bundle, a dump — anything a run leaves that
          is too big to be a value.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ArtifactSpec is something a run produced and somebody will want later.

              The bytes are NOT here. A record that carried them would be a record the
              whole cluster copies on every watch, and a report is megabytes. What is
              here is where they are and what they are — enough to find them and to
              know they did not change.
            properties:
              key:
                description: |-
                  Key is where the bytes are in storage. Derived from the run and the
                  name, so asking twice means one artifact rather than two.
                minLength: 1
                type: string
              name:
                description: Name is what the pipeline called it.
                minLength: 1
                type: string
              runRef:
                description: RunRef is who made it.
                properties:
                  name:
                    description: Name of the record referred to.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              until:
                description: |-
                  Until is when the bytes go away. Inherited if nobody said: the
                  pipeline's policy, and then the installation's. Finite at the top,
                  because storage that only grows is storage that one day stops.
                format: date-time
                type: string
            required:
            - key
            - name
            - runRef
            type: object
          status:
            description: ArtifactStatus is what came back from the machine that produced
              it.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              digest:
                description: |-
                  Digest is what the agent computed while uploading. It is how anyone
                  later can tell the bytes are the ones this run made.
                type: string
              size:
                description: Size in bytes.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
