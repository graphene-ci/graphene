# Temporal для разработки: один процесс со встроенной базой.
#
# Это `temporal server start-dev` — тот же сервер, что в проде, но со
# всем в одном процессе и в sqlite. Продовая раскладка (отдельные роли,
# внешняя база) — вопрос эксплуатации, а не разработки, и появится к M7.
#
# База лежит в emptyDir: под пересоздан — история потеряна. Для локальной
# разработки это верное поведение, а не недосмотр: `make down && make up`
# обязан давать чистое состояние.
apiVersion: v1
kind: Namespace
metadata:
  name: temporal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
    spec:
      containers:
        - name: temporal
          image: temporalio/temporal:1.8.2
          args:
            - server
            - start-dev
            - --ip=0.0.0.0
            - --port=7233
            - --ui-port=8233
            - --db-filename=/data/temporal.db
            - --namespace=graphene
            - --log-level=warn
          ports:
            - name: frontend
              containerPort: 7233
            - name: ui
              containerPort: 8233
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: frontend
            initialDelaySeconds: 3
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: temporal
spec:
  type: NodePort
  selector:
    app: temporal
  ports:
    - name: frontend
      port: 7233
      targetPort: frontend
      nodePort: 30733
    - name: ui
      port: 8233
      targetPort: ui
      nodePort: 30823
