# Учётка, которой провайдер ходит в облако.
#
# Ключ лежит секретом кластера и в манифест не попадает: значение
# разрешает тот, кто им пользуется, и обратно не возвращает.
apiVersion: yandex-cloud.jet.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  folder_id: YC_FOLDER_ID
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: yandex-key
      key: credentials
