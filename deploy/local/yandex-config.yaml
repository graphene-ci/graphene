# Учётка, которой провайдер ходит в облако.
#
# Ключ лежит секретом кластера и в манифест не попадает: значение
# разрешает тот, кто им пользуется, и обратно не возвращает. Облако и
# каталог — не секрет, они здесь, чтобы ресурсам не приходилось называть
# их каждый раз.
#
# Два вида, и это не дублирование. Провайдер v2 обслуживает две группы:
# старую (yandex-cloud.jet) и пространственную (yandex-cloud.m.jet).
# Пространственные записи — а наши именно такие, мы работаем в
# пространстве имён — ищут ClusterProviderConfig в СВОЕЙ группе и
# ProviderConfig из старой не видят. Выяснилось это тем, что записи
# создавались, а до облака не доходили.
apiVersion: yandex-cloud.jet.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    cloudId: __YC_CLOUD_ID__
    folderId: __YC_FOLDER_ID__
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: yandex-key
      key: credentials
---
apiVersion: yandex-cloud.m.jet.crossplane.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  credentials:
    cloudId: __YC_CLOUD_ID__
    folderId: __YC_FOLDER_ID__
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: yandex-key
      key: credentials
