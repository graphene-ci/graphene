# Локальный кластер для разработки. Один узел: нам нужны записи и
# контроллеры, а не расписание по узлам — машины прогонов живут снаружи
# кластера, а не в нём.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: graphene
servers: 1
agents: 0
image: rancher/k3s:v1.36.3-k3s1
kubeAPI:
  hostPort: "6443"
ports:
  # Фронтенд Temporal: воркер и CLI ходят в него с машины разработчика.
  - port: "7233:30733"
    nodeFilters:
      - server:0
  # Веб-интерфейс Temporal: смотреть, на чём стоит прогон.
  - port: "8233:30823"
    nodeFilters:
      - server:0
  # Раздача скрипта установки агента наружу (M2). Порт проброшен заранее:
  # добавить его позже — значит пересоздать кластер. 18080, а не 8080,
  # потому что 8080 на машине разработчика занят чем угодно.
  - port: "18080:30080"
    nodeFilters:
      - server:0
options:
  k3d:
    wait: true
  k3s:
    extraArgs:
      # Traefik нам не нужен: наружу мы отдаём через nodePort.
      - arg: --disable=traefik
        nodeFilters:
          - server:0
  kubeconfig:
    # Ничего не пишем в ~/.kube/config: окружение репозитория живёт
    # в самом репозитории и сносится вместе с ним.
    updateDefaultKubeconfig: false
    switchCurrentContext: false
