# Локальный кластер для разработки. Один узел: нам нужны записи и
# контроллеры, а не расписание по узлам — машины прогонов живут снаружи
# кластера, а не в нём.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: graphene
servers: 1
agents: 0
image: rancher/k3s:v1.36.3-k3s1
kubeAPI:
  hostIP: "127.0.0.1"
  hostPort: "6443"
# Всё прибито к 127.0.0.1. Здесь ни у чего нет проверки подлинности:
# dev-Temporal пускает кого угодно, API кластера отдан администратором.
# По умолчанию docker вешал бы это на все интерфейсы машины, то есть на
# любую сеть, к которой она подключена.
ports:
  # Фронтенд Temporal: воркер и CLI ходят в него с машины разработчика.
  - port: "127.0.0.1:7233:30733"
    nodeFilters:
      - server:0
  # Веб-интерфейс Temporal: смотреть, на чём стоит прогон.
  - port: "127.0.0.1:8233:30823"
    nodeFilters:
      - server:0
  # Раздача скрипта установки агента наружу (M2). Порт проброшен заранее:
  # добавить его позже — значит пересоздать кластер. 18080, а не 8080,
  # потому что 8080 на машине разработчика занят чем угодно.
  #
  # Обязательство M2: агент приходит по этому адресу за скриптом, и с
  # настоящей машины 127.0.0.1 недостижим. Тогда и решим — туннель,
  # адрес хоста или раздача не отсюда; сейчас открывать наружу нечего.
  - port: "127.0.0.1:18080:30080"
    nodeFilters:
      - server:0
# Реестр образов. Он нужен не для удобства: ревизия обязана держать
# дайджест, а дайджест существует только у образа, который куда-то
# положили. Локальная загрузка в docker даёт тег, и «повторить прогон»
# перестало бы значить «выполнить тот же код».
#
# Зеркало в конфиге containerd — то, что позволяет обойтись без правки
# /etc/hosts: с машины разработчика реестр это localhost:5555, а внутри
# кластера то же имя переписывается в адрес контейнера реестра.
registries:
  create:
    name: registry
    host: "127.0.0.1"
    hostPort: "5555"
  config: |
    mirrors:
      "localhost:5555":
        endpoint:
          - http://registry:5000

options:
  k3d:
    wait: true
  k3s:
    extraArgs:
      # Traefik нам не нужен: наружу мы отдаём через nodePort.
      - arg: --disable=traefik
        nodeFilters:
          - server:0
  kubeconfig:
    # Ничего не пишем в ~/.kube/config: окружение репозитория живёт
    # в самом репозитории и сносится вместе с ним.
    updateDefaultKubeconfig: false
    switchCurrentContext: false
