syntax = "proto3";

package graphene.management.v1;

option go_package = "github.com/graphene-ci/graphene/pkg/proto/management/v1;managementv1";

// RunsAPI starts and observes pipeline runs. The worker — a managed
// container or an inplace binary — serves the run's queue; the server
// starts the workflow (and the container, when the run is managed).
service RunsAPI {
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  // WatchRun streams the run's status transitions until a terminal
  // one; the first message carries the current status immediately.
  rpc WatchRun(WatchRunRequest) returns (stream WatchRunEvent);
  // Result waits for the run to finish and returns its typed result as
  // JSON.
  rpc RunResult(RunResultRequest) returns (RunResultResponse);
  // Cancel asks the run to stop; the guaranteed-teardown path still
  // runs (unlike a terminate).
  // Listing lives in ResourcesAPI.List under the system kind "run" —
  // this service is the VERBS of a run's lifecycle only.
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  // RunStatus reports the run's IN-FLIGHT state: its status and the
  // activities currently pending — what the run is doing right now, how
  // many attempts in, the last failure, and the latest heartbeat detail.
  // This is the "why is it stuck" view, sourced from the workflow's own
  // pending-activity state (no Temporal CLI needed).
  rpc RunStatus(RunStatusRequest) returns (RunStatusResponse);
}

message StartRunRequest {
  string run_id = 1;
  // Pipeline is the workflow type on the wire — the pipeline id.
  string pipeline = 2;
  // Params is the typed params value of the pipeline, as JSON.
  bytes params = 3;
  // Image, when set, makes the run MANAGED: the server launches the
  // worker container itself.
  string image = 4;
  // Labels mark the run for later selection — same semantics as
  // resource labels; "graphene.io/" keys are reserved for the system.
  map<string, string> labels = 5;
}

message StartRunResponse {
  string workflow_id = 1;
  string temporal_run_id = 2;
}

message GetRunRequest {
  string run_id = 1;
}

message GetRunResponse {
  string status = 1;
}

message WatchRunRequest {
  string run_id = 1;
}

message WatchRunEvent {
  string status = 1;
}

message RunResultRequest {
  string run_id = 1;
}

message RunResultResponse {
  // Result is the run's typed Result as JSON.
  bytes result = 1;
}

message CancelRunRequest {
  string run_id = 1;
}

message CancelRunResponse {}

message RunStatusRequest {
  string run_id = 1;
}

message RunStatusResponse {
  // Status is the workflow's execution status (Running, Completed, ...).
  string status = 1;
  // Pending are the activities the run is currently waiting on — empty
  // when nothing is in flight (between steps, or terminal).
  repeated PendingActivity pending = 2;
}

// PendingActivity is one in-flight activity of the run: what it is, how
// far into its retries, and why the last attempt failed.
message PendingActivity {
  string activity_type = 1;
  int32 attempt = 2;
  // State is the temporal pending state (Scheduled, Started, ...).
  string state = 3;
  // LastFailure is the message of the most recent failed attempt, empty
  // if none failed yet.
  string last_failure = 4;
  // HeartbeatDetail is the latest heartbeat note the activity recorded —
  // the "what it is doing right now" string.
  string heartbeat_detail = 5;
  // LastHeartbeatUnixMs is when that heartbeat landed (0 if never).
  int64 last_heartbeat_unix_ms = 6;
}

