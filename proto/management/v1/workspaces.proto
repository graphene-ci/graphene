syntax = "proto3";

package graphene.management.v1;

option go_package = "github.com/graphene-ci/graphene/pkg/proto/management/v1;managementv1";

// WorkspacesAPI administers WORKSPACES: a project's working area and
// the root of its life. A workspace has one source — a Git checkout or
// an uploaded tree — a runtime, a working tree kept on the server, and
// at most one pipeline. Listing, reading and deleting go through the
// ordinary ResourcesAPI: a workspace is a record like any other.
// A workspace is a RECORD: declared with Apply, changed with Invoke,
// read with Get. What stays here is what a command cannot carry —
// bytes, and questions about the installation rather than a record.
service WorkspacesAPI {
  // UploadSource stores a source tree and returns its reference. Bytes
  // do not travel in commands: a command's payload becomes an event in
  // the record's history, and a source tree would bury it.
  rpc UploadSource(UploadSourceRequest) returns (UploadSourceResponse);
  // DownloadSource hands back the workspace's current working tree.
  rpc DownloadSource(DownloadSourceRequest) returns (stream DownloadSourceChunk);
  // ListRuntimes answers "which languages can I write a pipeline in
  // on THIS installation".
  rpc ListRuntimes(ListRuntimesRequest) returns (ListRuntimesResponse);

  // The working tree is EDITABLE: Studio reads and writes files
  // straight into the workspace, and every write is durable — that is
  // the whole point of the tree living on the server.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc DeleteFile(DeleteFileRequest) returns (WriteFileResponse);
}

message UploadSourceRequest {
  string workspace_id = 1;
  // The tree as tar.gz.
  bytes source = 2;
}

message UploadSourceResponse {
  // Location is where the tree was stored; a declaration or a sync
  // command carries this reference instead of the bytes.
  string location = 1;
  string digest = 2;
}

message DownloadSourceRequest {
  string workspace_id = 1;
}

message DownloadSourceChunk {
  bytes data = 1;
}

message ListRuntimesRequest {}

message ListRuntimesResponse {
  message Runtime {
    string name = 1;
    string version = 2;
    string image = 3;
    bool is_default = 4;
  }
  repeated Runtime runtimes = 1;
}

message ListFilesRequest {
  string workspace_id = 1;
}

message ListFilesResponse {
  message File {
    string path = 1;
    int64 size = 2;
  }
  repeated File files = 1;
  string tree_digest = 2;
}

message ReadFileRequest {
  string workspace_id = 1;
  string path = 2;
}

message ReadFileResponse {
  bytes content = 1;
}

message WriteFileRequest {
  string workspace_id = 1;
  string path = 2;
  bytes content = 3;
}

message WriteFileResponse {
  string tree_digest = 1;
  uint64 generation = 2;
}

message DeleteFileRequest {
  string workspace_id = 1;
  string path = 2;
}
