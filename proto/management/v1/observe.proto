// The five dimensions of any entity — state, events, logs, metrics,
// trace — behind ONE surface. State and events come from the plane of
// truth (Temporal: describes and workflow histories) and are complete
// by construction; logs, metrics, and traces come from the telemetry
// plane (OTel backend behind the collector) and are as complete as
// delivery was. Refs address anything: "run/x", "agent/vm-1",
// "vpc.network/net", "artifact/r".
syntax = "proto3";

package graphene.management.v1;

import "proto/management/v1/resources.proto";

option go_package = "github.com/graphene-ci/graphene/pkg/proto/management/v1;managementv1";

service ObserveAPI {
  // State is dimension 1: the full current record.
  rpc State(ObserveStateRequest) returns (ObserveStateResponse);
  // Events is dimension 2: the entity's own history, translated —
  // classification without omission (raw carries everything).
  rpc Events(EventsRequest) returns (stream Event);
  // Logs is dimension 3 (telemetry plane). History first, then — with
  // follow — the live push from the collector: no polling anywhere.
  rpc Logs(LogsRequest) returns (stream LogChunk);
  // LogFacets answers the values a log field takes within the same
  // selection Logs would return, each with its record count.
  rpc LogFacets(LogFacetsRequest) returns (LogFacetsResponse);
  // Metrics is dimension 4: one snapshot chunk (the backend's PromQL
  // range JSON), then — with follow — live OTLP metric chunks.
  rpc Metrics(MetricsRequest) returns (stream MetricsChunk);
  // Trace is dimension 5: one snapshot chunk (Jaeger JSON), then —
  // with follow — live OTLP span chunks.
  rpc Trace(TraceRequest) returns (stream TraceChunk);
}

message ObserveStateRequest {
  string ref = 1;
}

message ObserveStateResponse {
  // Status is the workflow execution status (runs and entities alike).
  string status = 1;
  // Resource is the full record for entity refs (describe); unset for
  // plain runs.
  Resource resource = 2;
}

message EventsRequest {
  string ref = 1;
  // Resume: emit only events after this history event id.
  int64 after_event_id = 2;
  // Follow keeps the stream open for new events until the workflow
  // closes (or forever, for a living entity).
  bool follow = 3;
  // ActivityId slices the stream to one activity execution.
  string activity_id = 4;
  // Kinds keeps only events of these kinds ("note", "activity-failed",
  // ...); empty keeps everything.
  repeated string kinds = 5;
}

message Event {
  // EventId is the stable cursor: the Temporal history event id.
  int64 event_id = 1;
  int64 time_unix_nano = 2;
  // Kind classifies for rendering: run-started, activity-scheduled,
  // activity-completed, activity-failed, command-received, note (a
  // milestone the pipeline emitted), internal-<type>, ... Nothing is
  // omitted — unclassified history events pass through as internal-*.
  string kind = 3;
  // Subject: the activity/command name the event is about; a note's
  // own name.
  string subject = 4;
  // Agent executing it, when the task queue names one.
  string agent = 5;
  string status = 6;
  string error = 7;
  int32 attempt = 8;
  // Input/result payloads as JSON — history is secret-free by
  // construction (secrets travel as names), so nothing is stripped.
  bytes input = 9;
  bytes result = 10;
  // Raw is the entire history event (protojson) for drill-down.
  bytes raw = 11;
  // ActivityId groups the events of ONE activity execution: the
  // scheduled event's id, shared by its started/completed/failed
  // events. Empty for non-activity events. Lets a client render a
  // per-instance trace (three k8s.entity.declare calls are three rows,
  // not one).
  string activity_id = 12;
}

// Every read of a record's dimensions 3-5 has two query forms. RAW —
// `query` without `ref`: the backend's own language over the whole store,
// an administrator's. SCOPED — `ref` with `query`: the same language, but
// the door lays the record's scope (namespace, correlation, birth) over
// it in a way the expression cannot escape; authorized like any read of
// the record.
message LogsRequest {
  string ref = 1;
  bool follow = 2;
  // Since/Until bound the selection; zero means open.
  int64 since_unix_nano = 3;
  int64 until_unix_nano = 5;
  // Query: raw LogsQL without ref; a LogsQL filter ANDed into the
  // record's scope with ref.
  string query = 4;
  // Limit caps the records of one page (default 1000, at most 10000).
  int32 limit = 6;
  // Order is "asc" (default: oldest first) or "desc".
  string order = 7;
  // PageToken continues a previous page (opaque, from the page chunk).
  // A follow cannot be paged.
  string page_token = 8;
  // Filters, ANDed: severity names (INFO, WARN, ...), the record's
  // stream attribute (stdout/stderr), the agent and entity that emitted
  // it, a text the body must contain.
  repeated string severities = 9;
  string stream = 10;
  string agent = 11;
  string entity = 12;
  string text = 13;
}

// LogPage closes a history read: what the page did not carry.
message LogPage {
  // Returned is how many records this page sent — zero is an answer.
  int32 returned = 1;
  // Truncated: the selection has more than limit; NextPageToken
  // continues it. Empty token — the selection is exhausted.
  bool truncated = 2;
  string next_page_token = 3;
}

message LogFacetsRequest {
  // The same selection as LogsRequest (ref, query, bounds, filters).
  LogsRequest selection = 1;
  // Fields to count values of: severity, stream, agent, entity, job, ...
  repeated string fields = 2;
  // Limit caps the values per field (default 50).
  int32 limit = 3;
}

message LogFacetsResponse {
  message Value {
    string value = 1;
    int64 hits = 2;
  }
  message Facet {
    string field = 1;
    repeated Value values = 2;
  }
  repeated Facet facets = 1;
}

message LogRecord {
  int64 time_unix_nano = 1;
  string severity = 2;
  string body = 3;
  map<string, string> attributes = 4;
}

message LogChunk {
  oneof chunk {
    // Record is one log line — history and live alike (a log record
    // converts from OTLP without loss).
    LogRecord record = 1;
    // Dropped reports lines a slow consumer lost — telemetry sheds
    // rather than blocks, and says so instead of leaving silent holes.
    int64 dropped = 2;
    // Page closes the history part: count, truncation, the next token.
    LogPage page = 3;
  }
}

message MetricsRequest {
  string ref = 1;
  int64 start_unix_nano = 2;
  int64 end_unix_nano = 3;
  // Follow keeps the stream open: live points arrive as standard OTLP.
  bool follow = 4;
  // Query: raw PromQL without ref; with ref, the same PromQL evaluated
  // inside the record's scope — the backend applies the scope to every
  // selector and subquery of the expression.
  string query = 5;
  // StepSeconds is the range query's resolution; 0 lets the door pick
  // (range/200, at least 15 s). At most 11000 points per series.
  int32 step_seconds = 6;
}

message MetricsChunk {
  oneof chunk {
    // Snapshot is the HISTORY: the backend's own PromQL range JSON.
    bytes snapshot = 1;
    // Otlp is one LIVE batch: a serialized
    // opentelemetry ExportMetricsServiceRequest, records of this
    // subject only — decode it with any standard OTel library.
    bytes otlp = 2;
    int64 dropped = 3;
  }
}

message TraceRequest {
  string ref = 1;
  // Follow keeps the stream open: live spans arrive as standard OTLP.
  bool follow = 2;
  // Query: raw Jaeger search parameters ("service=x&tags=...") without
  // ref; with ref, the same parameters inside the record's scope — the
  // scope's tags win over the query's, the namespace is enforced.
  string query = 3;
  // Limit caps the traces of the snapshot (default 20).
  int32 limit = 4;
}

message TraceChunk {
  oneof chunk {
    // Snapshot is the HISTORY: Jaeger JSON of the subject's traces.
    bytes snapshot = 1;
    // Otlp is one LIVE batch: a serialized
    // opentelemetry ExportTraceServiceRequest of this subject.
    bytes otlp = 2;
    int64 dropped = 3;
  }
}
