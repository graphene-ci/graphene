// Management plane: the business surface over resources — what a CLI,
// a UI, or graphene-ci-cloud drives. The caller's NAMESPACE comes from
// its token, never from a request: a foreign namespace cannot even be
// asked for.
syntax = "proto3";

package graphene.management.v1;

option go_package = "github.com/graphene-ci/graphene/pkg/proto/management/v1;managementv1";

import "google/protobuf/timestamp.proto";

// ResourcesAPI operates the resource records: entity workflows with
// owned lifetimes in one ownership tree.
service ResourcesAPI {
  // List returns the resources matching the selector — a snapshot.
  // The system kind "run" lists pipeline runs through the same door.
  rpc List(ListRequest) returns (ListResponse);
  // Count answers how many records match — cheap (no rows), optionally
  // grouped by execution status (the one grouping the store supports).
  rpc Count(CountRequest) returns (CountResponse);
  // CountOwned answers, for each named owner, how many LIVE records it
  // owns — one call for a whole table page ("owns" column).
  rpc CountOwned(CountOwnedRequest) returns (CountOwnedResponse);
  // Get describes one resource: phase, spec, state — works even after
  // the record closed.
  rpc Get(GetRequest) returns (GetResponse);
  // Tree returns the ownership subtree under an owner, parents before
  // children.
  rpc Tree(TreeRequest) returns (TreeResponse);
  // Delete tears the resource down with its whole subtree, deepest
  // first, and waits for the teardown to finish.
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // Transfer gives the resource (with its subtree) to a new owner;
  // ownership is given away, never taken.
  rpc Transfer(TransferRequest) returns (TransferResponse);
  // Invoke sends an entity command by name with a raw JSON payload and
  // returns the raw JSON result. The entity's validators still run; the
  // request id deduplicates retries.
  rpc Invoke(InvokeRequest) returns (InvokeResponse);

  // Apply declares a record of ANY kind: the one door creation goes
  // through, so a new kind never needs an API of its own.
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  // Kinds answers what this installation can declare and command, with
  // the schema of every spec and payload — what a CLI validates
  // against and a UI builds forms from, instead of hard-coding a
  // vocabulary it should be discovering.
  rpc Kinds(KindsRequest) returns (KindsResponse);
}

// Selector picks resources: every set field must match.
message Selector {
  // Kind of the record ("agent", "artifact", library kinds).
  string kind = 1;
  // Phase: creating | ready | deleting | deleted | ...
  string phase = 2;
  // Owner ref ("run/x", "stand/p", "agent/vm-1").
  string owner = 3;
  // Labels matched by equality on the record's labels.
  map<string, string> labels = 4;
}

message ListRequest {
  // Selector is the structural filter — the machine path.
  Selector selector = 1;
  // Query is the selector LANGUAGE — `kind=run, phase in (Running),
  // label.env=prod, started>-2h`. Reserved fields: kind, id, phase,
  // owner, pipeline (runs only), started, finished; labels go as
  // label.<key>. Exactly one of query and selector may be set.
  string query = 4;
  // PageSize bounds one reply; 0 returns everything in one go.
  int32 page_size = 2;
  // PageToken continues a previous listing (opaque, from the reply).
  string page_token = 3;
}

message CountRequest {
  // Same duality as ListRequest: one of the two.
  Selector selector = 1;
  string query = 2;
  // GroupByStatus splits the count by execution status.
  bool group_by_status = 3;
}

message CountOwnedRequest {
  // Owner refs ("run/x", "stand/p"); at most 100 per call.
  repeated string owners = 1;
}

message CountOwnedResponse {
  // Counts of live records per owner ref; absent — zero.
  map<string, int64> counts = 1;
}

message CountResponse {
  int64 total = 1;
  message Group {
    // Status is the Temporal execution status ("Running", ...).
    string status = 1;
    int64 count = 2;
  }
  repeated Group groups = 2;
}

message Resource {
  // Ref addresses the record: "kind/id" — also its workflow id.
  string ref = 1;
  string kind = 2;
  string phase = 3;
  // Owner is the CURRENT owner from the record's state.
  string owner = 4;
  // Spec and state as raw JSON — typed by whoever defined the kind.
  bytes spec = 5;
  bytes state = 6;
  int32 pending_commands = 7;
  bool marked_for_deletion = 8;
  // Labels are the record's markers — metric-label semantics; keys
  // under "graphene.io/" are written by the system. Run rows carry the
  // synthetic "graphene.io/pipeline" label with the pipeline id.
  map<string, string> labels = 9;
  // StartedAt/FinishedAt come from visibility; FinishedAt is unset
  // while the workflow is open.
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp finished_at = 11;
}

message ListResponse {
  repeated Resource resources = 1;
  // NextPageToken continues the listing; empty — the end.
  string next_page_token = 2;
}

message GetRequest {
  string ref = 1;
}

message GetResponse {
  Resource resource = 1;
}

message TreeRequest {
  // Owner to start from: "run/x", "stand/p", or a resource ref.
  string owner = 1;
}

// TreeNode is one resource with its children.
message TreeNode {
  Resource resource = 1;
  repeated TreeNode children = 2;
}

message TreeResponse {
  repeated TreeNode roots = 1;
}

message DeleteRequest {
  string ref = 1;
}

message DeleteResponse {}

message TransferRequest {
  string ref = 1;
  string new_owner = 2;
  // Keep bounds the stay under the new owner, seconds; 0 keeps the
  // resource until an explicit delete.
  int64 keep_seconds = 3;
}

message TransferResponse {}

message InvokeRequest {
  string ref = 1;
  string command = 2;
  // Payload is the command's request as JSON.
  bytes payload = 3;
  // RequestId deduplicates retries (empty — generated).
  string request_id = 4;
}

message InvokeResponse {
  // Result is the command's response as JSON.
  bytes result = 1;
}

message ApplyRequest {
  string kind = 1;
  string id = 2;
  // Spec is the declaration, in the shape the kind defines.
  bytes spec = 3;
  map<string, string> labels = 4;
}

message ApplyResponse {
  // Ref is the record's address ("workspace/delivery").
  string ref = 1;
}

message KindsRequest {}

message KindsResponse {
  message Command {
    string name = 1;
    // PayloadSchema is a schemapb schema as protojson; empty when the
    // command takes nothing.
    bytes payload_schema = 2;
  }
  message Kind {
    string name = 1;
    // Declarable says whether Apply may create this kind directly.
    bool declarable = 2;
    // SpecSchema is a schemapb schema as protojson.
    bytes spec_schema = 3;
    repeated Command commands = 4;
    string description = 5;
  }
  repeated Kind kinds = 1;
}
