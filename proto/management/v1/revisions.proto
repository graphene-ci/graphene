syntax = "proto3";

package graphene.management.v1;

option go_package = "github.com/graphene-ci/graphene/pkg/proto/management/v1;managementv1";

// RevisionsAPI is the source-first contour: a SOURCE TREE goes in, the
// server materializes it (build in a runtime container, manifest from
// the binary's describe mode, ko-style OCI push), and the result is a
// PIPELINE REVISION — runnable as a draft, activatable as the version
// automatic starts use. No user-side push exists on this path.
service RevisionsAPI {
  // Materialize STREAMS progress: a source build takes minutes, and a
  // silent request dies on the first idle NAT between the client and
  // the door. The stream is also the Studio build log.
  rpc Materialize(MaterializeRequest) returns (stream MaterializeEvent);
  rpc ListRevisions(ListRevisionsRequest) returns (ListRevisionsResponse);
  rpc RunRevision(RunRevisionRequest) returns (RunRevisionResponse);
  rpc ActivateRevision(ActivateRevisionRequest) returns (ActivateRevisionResponse);
}

message MaterializeRequest {
  string pipeline_id = 1;
  // The full source tree as tar.gz — the workspace root is the build
  // root: `go build .`, one package main.
  bytes source = 2;
}

message MaterializeEvent {
  // Stage: "upload" | "runtime" | "build" | "describe" | "publish" |
  // "done" — the phase this event reports.
  string stage = 1;
  // Message is one progress line (a build log line, a status).
  string message = 2;
  // Result is set on the final "done" event.
  MaterializeResult result = 3;
}

message MaterializeResult {
  string revision_id = 1;
  string image = 2;
  // The revision's manifest as protojson — what Plan renders.
  bytes manifest = 3;
}

message ListRevisionsRequest {
  string pipeline_id = 1;
}

message ListRevisionsResponse {
  message Revision {
    string id = 1;
    string image = 2;
    string source_digest = 3;
    string created_at = 4;
    bool active = 5;
  }
  repeated Revision revisions = 1;
}

message RunRevisionRequest {
  string pipeline_id = 1;
  string revision_id = 2;
  string run_id = 3;
  bytes params = 4;
  map<string, string> labels = 5;
}

message RunRevisionResponse {
  string workflow_id = 1;
  string temporal_run_id = 2;
}

message ActivateRevisionRequest {
  string pipeline_id = 1;
  string revision_id = 2;
}

message ActivateRevisionResponse {}
