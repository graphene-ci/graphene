syntax = "proto3";

package graphene.management.v1;

option go_package = "github.com/graphene-ci/graphene/pkg/proto/management/v1;managementv1";

// VarsAPI administers the namespace's VARIABLES — the visible sibling
// of secrets: environment configuration (cloud folder ids, hosts) that
// does not belong in pipeline code but is not sensitive. Params may
// reference one as "${var:name}"; the door substitutes the value when
// the run starts, before schema validation. Unlike secrets, values
// read back.
service VarsAPI {
  rpc SetVar(SetVarRequest) returns (SetVarResponse);
  rpc DeleteVar(DeleteVarRequest) returns (DeleteVarResponse);
  rpc ListVars(ListVarsRequest) returns (ListVarsResponse);
}

message SetVarRequest {
  string name = 1;
  string value = 2;
}

message SetVarResponse {}

message DeleteVarRequest {
  string name = 1;
}

message DeleteVarResponse {}

message ListVarsRequest {}

message ListVarsResponse {
  message Var {
    string name = 1;
    string value = 2;
  }
  repeated Var vars = 1;
}
