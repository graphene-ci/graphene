name: release

# A pushed semver tag (X.Y.Z, no prefix) IS a release: goreleaser ships the
# graphenectl CLI to a GitHub Release, and the docker job builds the
# graphene-server image and pushes it to GHCR. The image embeds the agent
# binary at the LATEST agent release (resolved at build time) — the agent
# versions independently, so a graphene release never forces a matching
# agent tag.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      agent_ref: ${{ steps.agent.outputs.AGENT_REF }}
    steps:
      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be a Go module version vX.Y.Z; got: $TAG" >&2
            exit 1
          fi
          # version WITHOUT the v for image tags and ldflags.
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Resolve latest agent release
        id: agent
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The agent versions on its own cadence; bundle whatever its latest
          # release is (a vX.Y.Z tag go install can fetch).
          REF="$(gh release view --repo graphene-ci/agent --json tagName -q .tagName)"
          if ! [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "latest agent release is not a vX.Y.Z tag; got: $REF" >&2
            exit 1
          fi
          echo "AGENT_REF=${REF}" >> "$GITHUB_OUTPUT"

  cli:
    name: graphenectl (goreleaser)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server-image:
    name: graphene-server image
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/server.Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            AGENT_REF=${{ needs.prepare.outputs.agent_ref }}
          tags: |
            ghcr.io/graphene-ci/graphene-server:${{ needs.prepare.outputs.version }}
            ghcr.io/graphene-ci/graphene-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
