# The graphene POLYGON: a complete demo/dev installation — one command,
# everything visible. Production delivery is a SEPARATE stage (helm,
# real Temporal cluster, external S3/telemetry) and deliberately not
# this file.
#
# Temporal (dev server), minio, the registry, and signoz are INTERNAL —
# the server is ONE door on :7233 (gRPC, the browser ConnectRPC
# surface, probes, and the registry proxy split by content). Agents
# connect from outside to GRAPHENE_SERVER_EXTERNAL — set it to your
# host's address for machines beyond localhost, and replace the dev
# tokens. TLS: put a proxy in front (caddy: reverse_proxy
# h2c://host:7233). SigNoz UI is published on :8080 — the telemetry
# plane of every run, agent, and resource.
services:
  temporal:
    image: temporalio/temporal:latest
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --port
      - "7233"
      - --db-filename
      - /data/temporal.db
      - --search-attribute
      - EntityKind=Keyword
      - --search-attribute
      - EntityPhase=Keyword
      - --search-attribute
      - EntityOwner=Keyword
      - --search-attribute
      - EntityLabels=KeywordList
      - --search-attribute
      - EntityKeepUntil=Datetime
    volumes:
      - temporal-data:/data
    # The named volume is root-owned; the dev server just needs to
    # write its sqlite file — root is fine on the polygon.
    user: "0:0"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [graphene]

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: graphene
      MINIO_ROOT_PASSWORD: graphene-dev-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [graphene]

  # One-shot: the buckets the blob store and the registry live in. The
  # server ensures its own bucket too — this covers the registry, which
  # does not.
  minio-buckets:
    image: minio/mc:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set graphene http://minio:9000 graphene graphene-dev-secret &&
        mc mb --ignore-existing graphene/graphene-blobs graphene/graphene-registry
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [graphene]

  registry:
    image: registry:2
    environment:
      REGISTRY_STORAGE: s3
      REGISTRY_STORAGE_S3_REGIONENDPOINT: "http://minio:9000"
      REGISTRY_STORAGE_S3_REGION: "us-east-1"
      REGISTRY_STORAGE_S3_BUCKET: "graphene-registry"
      REGISTRY_STORAGE_S3_ACCESSKEY: "graphene"
      REGISTRY_STORAGE_S3_SECRETKEY: "graphene-dev-secret"
      REGISTRY_STORAGE_S3_SECURE: "false"
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: "true"
    depends_on:
      minio-buckets:
        condition: service_completed_successfully
    networks: [graphene]

  # The telemetry plane in one image: OTLP in, ClickHouse under,
  # SigNoz UI out. Dimensions 3-5 (logs, metrics, traces) of every
  # entity live here, correlated by the graphene.* attributes.
  signoz:
    image: signoz/signoz-standalone:latest
    privileged: true
    volumes:
      - signoz-clickhouse:/var/lib/clickhouse
      - signoz-data:/var/lib/signoz
      # v0.0.4 image bug: units want a clickhouse user the image never
      # creates — declare it via sysusers, and chown the volumes before
      # every clickhouse start (tmpfiles does not run in this boot).
      - ./deployments/signoz/clickhouse-sysusers.conf:/etc/sysusers.d/clickhouse.conf:ro
      - ./deployments/signoz/clickhouse-override.conf:/etc/systemd/system/signoz-telemetrystore-clickhouse-0-0.service.d/override.conf:ro
      - ./deployments/signoz/clickhouse-override.conf:/etc/systemd/system/signoz-telemetrykeeper-clickhousekeeper-0.service.d/override.conf:ro
    ports:
      # The SigNoz UI — the polygon's observability window.
      - "8080:8080"
    networks: [graphene]

  # One-shot: SigNoz refuses telemetry until its first user/org exists —
  # register the polygon admin so ingestion opens without a manual step.
  # (Change the credentials along with the tokens before exposing.)
  signoz-bootstrap:
    image: curlimages/curl:latest
    command:
      - sh
      - -c
      - |
        until curl -s -o /dev/null http://signoz:8080/; do sleep 3; done
        curl -s -X POST http://signoz:8080/api/v1/register           -H 'Content-Type: application/json'           -d '{"email":"admin@graphene.local","password":"Graphene-dev-1!","name":"graphene","orgName":"graphene"}'           || true
    depends_on: [signoz]
    restart: "no"
    networks: [graphene]

  graphene-server:
    build:
      context: .
      dockerfile: deployments/server.Dockerfile
    # The WHOLE configuration is environment: the dotted YAML path
    # uppercased under the GRAPHENE prefix (see internal/config).
    environment:
      GRAPHENE_SERVER_LISTEN: ":7233"
      # Agents and workers OUTSIDE this host dial this — set to the
      # host's real address for machines beyond localhost.
      GRAPHENE_SERVER_EXTERNAL: "127.0.0.1:7233"
      GRAPHENE_TEMPORAL_HOST_PORT: "temporal:7233"
      GRAPHENE_TEMPORAL_NAMESPACE: "default"
      GRAPHENE_REGISTRY_UPSTREAM: "http://registry:5000"
      GRAPHENE_OTEL_ENDPOINT: "signoz:4317"
      GRAPHENE_BLOBS_BACKEND: "s3"
      GRAPHENE_BLOBS_S3_ENDPOINT: "minio:9000"
      GRAPHENE_BLOBS_S3_BUCKET: "graphene-blobs"
      GRAPHENE_BLOBS_S3_ACCESS_KEY: "graphene"
      GRAPHENE_BLOBS_S3_SECRET_KEY: "graphene-dev-secret"
      # REPLACE the dev tokens before exposing the door anywhere.
      GRAPHENE_AUTH_ADMIN_TOKENS: "dev-admin-token"
      GRAPHENE_AUTH_RUN_TOKENS: "dev-run-token"
      GRAPHENE_AUTH_AGENT_TOKENS: "vm-1:dev-agent-token"
      GRAPHENE_LOG_LEVEL: "info"
      GRAPHENE_LOG_FORMAT: "json"
    volumes:
      # The managed contour launches run-worker containers on this host.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # THE door: gRPC (agents, workers, Temporal proxy, worker and
      # management planes, OTLP), ConnectRPC for browsers, probes, and
      # the registry proxy — one port. Managed run containers run with
      # host networking and reach it through the published port
      # (external).
      - "7233:7233"
    # Root for the docker socket; the binary itself needs nothing else.
    user: "0:0"
    networks: [graphene]
    depends_on:
      temporal:
        condition: service_healthy
      minio-buckets:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  temporal-data:
  minio-data:
  signoz-clickhouse:
  signoz-data:

networks:
  graphene:
    name: graphene
