# The graphene dev installation: complete demo/dev stack — one command,
# everything visible. Production delivery is a SEPARATE stage (helm,
# real Temporal cluster, external S3/telemetry) and deliberately not
# this file.
#
# Temporal (dev server), minio, and the registry are INTERNAL —
# the server is ONE door on :7233 (gRPC, the browser ConnectRPC
# surface, probes, and the registry proxy split by content). Agents
# connect from outside to GRAPHENE_SERVER_EXTERNAL — set it to your
# host's address for machines beyond localhost, and replace the dev
# tokens. TLS: put a proxy in front (caddy: reverse_proxy
# h2c://host:7233).
#
# Telemetry is the Victoria stack — chosen for its STANDARD query
# surfaces (PromQL for metrics, the Jaeger API for traces), so nothing
# of ours couples to a vendor: victoriametrics :8428, victorialogs
# :9428, victoriatraces :10428 — each has its own web UI on that port.
services:
  temporal:
    image: temporalio/temporal:latest
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --port
      - "7233"
      - --db-filename
      - /data/temporal.db
      - --search-attribute
      - EntityKind=Keyword
      - --search-attribute
      - EntityPhase=Keyword
      - --search-attribute
      - EntityOwner=Keyword
      - --search-attribute
      - EntityLabels=KeywordList
      - --search-attribute
      - EntityKeepUntil=Datetime
    volumes:
      - temporal-data:/data
    # The named volume is root-owned; the dev server just needs to
    # write its sqlite file — root is fine on the dev stack.
    user: "0:0"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [graphene]

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: graphene
      MINIO_ROOT_PASSWORD: graphene-dev-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [graphene]

  # One-shot: the buckets the blob store and the registry live in. The
  # server ensures its own bucket too — this covers the registry, which
  # does not.
  minio-buckets:
    image: minio/mc:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set graphene http://minio:9000 graphene graphene-dev-secret &&
        mc mb --ignore-existing graphene/graphene-blobs graphene/graphene-registry
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [graphene]

  registry:
    image: registry:2
    environment:
      REGISTRY_STORAGE: s3
      REGISTRY_STORAGE_S3_REGIONENDPOINT: "http://minio:9000"
      REGISTRY_STORAGE_S3_REGION: "us-east-1"
      REGISTRY_STORAGE_S3_BUCKET: "graphene-registry"
      REGISTRY_STORAGE_S3_ACCESSKEY: "graphene"
      REGISTRY_STORAGE_S3_SECRETKEY: "graphene-dev-secret"
      REGISTRY_STORAGE_S3_SECURE: "false"
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: "true"
      # No presigned-URL redirects: minio is not reachable from outside
      # the compose network — the registry streams blobs itself.
      REGISTRY_STORAGE_REDIRECT_DISABLE: "true"
    depends_on:
      minio-buckets:
        condition: service_completed_successfully
    networks: [graphene]

  # Dimensions 3-5 (metrics, logs, traces) of every entity live in the
  # Victoria stack, correlated by the graphene.* attributes. Each is a
  # single binary that ingests OTLP directly (the server forwards) and
  # answers a STANDARD query surface: PromQL, LogsQL, the Jaeger API.
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    command: ["-retentionPeriod=90d"]
    command: ["--storageDataPath=/storage"]
    volumes:
      - vm-data:/storage
    ports:
      - "8428:8428"
    networks: [graphene]

  victorialogs:
    image: victoriametrics/victoria-logs:latest
    command: ["-retentionPeriod=30d"]
    command: ["--storageDataPath=/storage"]
    volumes:
      - vl-data:/storage
    ports:
      - "9428:9428"
    networks: [graphene]

  victoriatraces:
    image: victoriametrics/victoria-traces:latest
    command: ["-retentionPeriod=14d"]
    command: ["--storageDataPath=/storage"]
    volumes:
      - vt-data:/storage
    ports:
      - "10428:10428"
    networks: [graphene]

  graphene-server:
    build:
      context: .
      dockerfile: deployments/server.Dockerfile
    # The WHOLE configuration is environment: the dotted YAML path
    # uppercased under the GRAPHENE prefix (see internal/config).
    environment:
      GRAPHENE_SERVER_LISTEN: ":7233"
      # Agents and workers OUTSIDE this host dial this — set to the
      # host's real address for machines beyond localhost.
      GRAPHENE_SERVER_EXTERNAL: "127.0.0.1:7233"
      GRAPHENE_TEMPORAL_HOST_PORT: "temporal:7233"
      GRAPHENE_TEMPORAL_NAMESPACE: "default"
      GRAPHENE_REGISTRY_UPSTREAM: "http://registry:5000"
      GRAPHENE_OTEL_TRACES: "http://victoriatraces:10428/insert/opentelemetry/v1/traces"
      GRAPHENE_OTEL_LOGS: "http://victorialogs:9428/insert/opentelemetry/v1/logs"
      GRAPHENE_OTEL_METRICS: "http://victoriametrics:8428/opentelemetry/v1/metrics"
      GRAPHENE_OTEL_QUERY_METRICS: "http://victoriametrics:8428"
      GRAPHENE_OTEL_QUERY_LOGS: "http://victorialogs:9428"
      GRAPHENE_OTEL_QUERY_TRACES: "http://victoriatraces:10428/select/jaeger"
      GRAPHENE_BLOBS_BACKEND: "s3"
      GRAPHENE_BLOBS_S3_ENDPOINT: "minio:9000"
      GRAPHENE_BLOBS_S3_BUCKET: "graphene-blobs"
      GRAPHENE_BLOBS_S3_ACCESS_KEY: "graphene"
      GRAPHENE_BLOBS_S3_SECRET_KEY: "graphene-dev-secret"
      # REPLACE the dev tokens before exposing the door anywhere.
      GRAPHENE_AUTH_ADMIN_TOKENS: "dev-admin-token"
      GRAPHENE_AUTH_RUN_TOKENS: "dev-run-token"
      GRAPHENE_AUTH_AGENT_TOKENS: "vm-1:dev-agent-token"
      # Secrets survive restarts in the sealed store on this volume;
      # REPLACE the dev key before exposing the door anywhere.
      GRAPHENE_SECRETS_KEY: "6465762d6b65792d6465762d6b65792d6465762d6b65792d6465762d6b657921"
      GRAPHENE_LOG_LEVEL: "info"
      GRAPHENE_LOG_FORMAT: "json"
    volumes:
      # The managed contour launches run-worker containers on this host.
      - /var/run/docker.sock:/var/run/docker.sock
      - graphene-data:/var/lib/graphene
    ports:
      # THE door: gRPC (agents, workers, Temporal proxy, worker and
      # management planes, OTLP), ConnectRPC for browsers, probes, and
      # the registry proxy — one port. Managed run containers run with
      # host networking and reach it through the published port
      # (external).
      - "7233:7233"
    # Root for the docker socket; the binary itself needs nothing else.
    user: "0:0"
    # SELinux hosts (Fedora): without this the daemon socket mount is
    # readable but not connectable from inside the container.
    security_opt:
      - label:disable
    networks: [graphene]
    depends_on:
      temporal:
        condition: service_healthy
      minio-buckets:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  graphene-data:
  temporal-data:
  minio-data:
  vm-data:
  vl-data:
  vt-data:

networks:
  graphene:
    name: graphene

