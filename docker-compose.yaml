# The graphene installation: the server and everything it stands on.
# Temporal, minio, and the registry are INTERNAL — the server is the
# single door (gRPC :7233, HTTP :7280, ConnectRPC :7281 for browsers).
# Agents connect from outside to GRAPHENE_SERVER_EXTERNAL_GRPC — set it
# to your host's address for machines beyond localhost, and replace the
# dev tokens.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [graphene]

  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [graphene]

  temporal-search-attributes:
    image: temporalio/admin-tools:1.29.7-tctl-1.18.4-cli-1.7.2
    entrypoint: ["/bin/sh", "/create-search-attributes.sh"]
    volumes:
      - ./deployments/temporal/create-search-attributes.sh:/create-search-attributes.sh:ro
    depends_on:
      temporal:
        condition: service_healthy
    restart: "no"
    networks: [graphene]

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: graphene
      MINIO_ROOT_PASSWORD: graphene-dev-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [graphene]

  # One-shot: the buckets the blob store and the registry live in. The
  # server ensures its own bucket too — this covers the registry, which
  # does not.
  minio-buckets:
    image: minio/mc:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set graphene http://minio:9000 graphene graphene-dev-secret &&
        mc mb --ignore-existing graphene/graphene-blobs graphene/graphene-registry
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [graphene]

  registry:
    image: registry:2
    environment:
      REGISTRY_STORAGE: s3
      REGISTRY_STORAGE_S3_REGIONENDPOINT: "http://minio:9000"
      REGISTRY_STORAGE_S3_REGION: "us-east-1"
      REGISTRY_STORAGE_S3_BUCKET: "graphene-registry"
      REGISTRY_STORAGE_S3_ACCESSKEY: "graphene"
      REGISTRY_STORAGE_S3_SECRETKEY: "graphene-dev-secret"
      REGISTRY_STORAGE_S3_SECURE: "false"
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: "true"
    depends_on:
      minio-buckets:
        condition: service_completed_successfully
    networks: [graphene]

  graphene-server:
    build:
      context: .
      dockerfile: deployments/server.Dockerfile
    # The WHOLE configuration is environment: the dotted YAML path
    # uppercased under the GRAPHENE prefix (see internal/config).
    environment:
      GRAPHENE_SERVER_GRPC: ":7233"
      GRAPHENE_SERVER_HTTP: ":7280"
      GRAPHENE_SERVER_CONNECT: ":7281"
      # Agents and workers OUTSIDE this host dial these — set to the
      # host's real address for machines beyond localhost.
      GRAPHENE_SERVER_EXTERNAL_GRPC: "127.0.0.1:7233"
      GRAPHENE_SERVER_EXTERNAL_HTTP: "http://127.0.0.1:7280"
      GRAPHENE_TEMPORAL_HOST_PORT: "temporal:7233"
      GRAPHENE_TEMPORAL_NAMESPACE: "default"
      GRAPHENE_REGISTRY_UPSTREAM: "http://registry:5000"
      GRAPHENE_BLOBS_BACKEND: "s3"
      GRAPHENE_BLOBS_S3_ENDPOINT: "minio:9000"
      GRAPHENE_BLOBS_S3_BUCKET: "graphene-blobs"
      GRAPHENE_BLOBS_S3_ACCESS_KEY: "graphene"
      GRAPHENE_BLOBS_S3_SECRET_KEY: "graphene-dev-secret"
      # REPLACE the dev tokens before exposing the door anywhere.
      GRAPHENE_AUTH_ADMIN_TOKENS: "dev-admin-token"
      GRAPHENE_AUTH_RUN_TOKENS: "dev-run-token"
      GRAPHENE_AUTH_AGENT_TOKENS: "vm-1:dev-agent-token"
      GRAPHENE_LOG_LEVEL: "info"
      GRAPHENE_LOG_FORMAT: "json"
    volumes:
      # The managed contour launches run-worker containers on this host.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # The doors: gRPC (agents, workers, Temporal proxy), HTTP (probes,
      # registry proxy), ConnectRPC (management API for browsers).
      # Managed run containers run with host networking and reach the
      # gRPC door through the published port (externalGrpc).
      - "7233:7233"
      - "7280:7280"
      - "7281:7281"
    # Root for the docker socket; the binary itself needs nothing else.
    user: "0:0"
    networks: [graphene]
    depends_on:
      temporal:
        condition: service_healthy
      temporal-search-attributes:
        condition: service_completed_successfully
      minio-buckets:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:

networks:
  graphene:
    name: graphene
